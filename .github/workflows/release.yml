name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            build_command: npm run build && npx electron-builder --win nsis --publish never
            artifact_glob: dist/*.exe
          - name: macOS
            os: macos-latest
            build_command: npm run build && npx electron-builder --mac dmg zip --publish never
            artifact_glob: |
              dist/*.dmg
              dist/*.zip
          - name: Linux
            os: ubuntu-latest
            build_command: npm run build && npx electron-builder --linux AppImage deb --publish never
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build artifacts
        run: ${{ matrix.build_command }}

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.artifact_glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
