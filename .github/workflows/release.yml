name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            build_command: npm run build && npx electron-builder --win nsis --publish never
            artifact_glob: dist/*.exe
          - name: macOS
            os: macos-latest
            build_command: npm run build && npx electron-builder --mac dmg zip --publish never
            artifact_glob: |
              dist/*.dmg
              dist/*.zip
          - name: Linux
            os: ubuntu-latest
            build_command: npm run build && npx electron-builder --linux AppImage deb --publish never
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(.+)$') {
            throw "Tag format must be vX.Y.Z. Received: $tag"
          }

          $tagVersion = $Matches[1]
          $packageVersion = node -p "require('./package.json').version"

          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package.json version $packageVersion"
          }

      - name: Prepare release notes from changelog
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $lines = Get-Content CHANGELOG.md
          $start = -1
          $end = $lines.Length

          for ($i = 0; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match "^## \[$([regex]::Escape($version))\]") {
              $start = $i
              continue
            }

            if ($start -ge 0 -and $i -gt $start -and $lines[$i] -match '^## \[') {
              $end = $i
              break
            }
          }

          if ($start -lt 0) {
            throw "No changelog section found for version $version"
          }

          $section = $lines[($start + 1)..($end - 1)]
          $content = @(
            "Release $version"
            ""
            $section
          ) -join "`n"

          Set-Content -Path release-notes.md -Value $content

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build artifacts
        run: ${{ matrix.build_command }}

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: release-notes.md
          files: ${{ matrix.artifact_glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
